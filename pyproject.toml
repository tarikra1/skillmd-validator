[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skillmd-validator"
version = "1.0.0"
description = "Schema validator, broken-reference checker, secret/path scanner, and token estimator for SKILL.md AI agent skills."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Tarik", email = "tarikra1@users.noreply.github.com" }
]
keywords = ["skill-md", "claude-code", "agent-skills", "linter", "prompt-ops", "developer-tools"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tarikra1/skillmd-validator"
Repository = "https://github.com/tarikra1/skillmd-validator"
Changelog = "https://github.com/tarikra1/skillmd-validator/blob/main/CHANGELOG.md"
Issues = "https://github.com/tarikra1/skillmd-validator/issues"

[project.scripts]
skillmd-check = "skillmd_validator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
